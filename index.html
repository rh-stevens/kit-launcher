<title>Kit Launcher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a single centred card, like a kit-box side label — name on top, two actions beneath. */
:root{
  --bg:#f3f1ec; --fg:#1e1f1b; --muted:#6b6d63; --panel:#ffffff; --line:#d9d6cc;
  --accent:#4d5b3a; --accent-fg:#ffffff; --accent2:#7b5ea7;
  --display:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1c18; --fg:#ebe9e1; --muted:#9a9c90; --panel:#24261f; --line:#3a3c33; --accent:#9fb37e; --accent-fg:#161711; --accent2:#b9a3e0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1c18; --fg:#ebe9e1; --muted:#9a9c90; --panel:#24261f; --line:#3a3c33; --accent:#9fb37e; --accent-fg:#161711; --accent2:#b9a3e0; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px;
  display:flex;flex-direction:column;align-items:center}
.card{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:28px 24px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:clamp(22px,4vw,30px);line-height:1.15;font-weight:600;text-wrap:balance}
.meta{font:400 13px/1.5 var(--mono);color:var(--muted);word-break:break-all}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.btn{flex:1 1 200px;min-width:0;text-align:center;text-decoration:none;font-weight:600;font-size:15px;padding:14px 16px;border-radius:5px;border:1px solid transparent;cursor:pointer}
.btn.dt{background:var(--accent);color:var(--accent-fg)}
.btn.ob{background:transparent;color:var(--fg);border-color:var(--accent2)}
.btn:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.hint{font-size:13px;line-height:1.5;color:var(--muted);margin:0}
input{width:100%;box-sizing:border-box;font:400 15px var(--display);padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg)}
ul{list-style:none;margin:0;padding:0;max-height:50vh;overflow:auto;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
li a{display:block;padding:10px 4px;color:var(--fg);text-decoration:none}
li a:hover{color:var(--accent)}
</style></head><body>
<main class="card" id="card">
  <div class="eyebrow" id="eyebrow">Model Kits</div>
  <h1 id="name">Kit launcher</h1>
  <div class="meta" id="meta"></div>
  <div class="actions" id="actions" hidden>
    <a class="btn dt" id="dt" href="#">Open in DEVONthink</a>
    <a class="btn ob" id="ob" href="#">Open in Obsidian</a>
  </div>
  <p class="hint" id="hint"></p>
  <div id="browse" hidden>
    <input id="q" type="search" placeholder="Search kits…" aria-label="Search kits">
    <ul id="list"></ul>
  </div>
</main>

const VAULT = 'my_obsidian_Vault';
const dtLink = u => 'x-devonthink-item://' + u;
const obLink = stem => 'obsidian://open?vault=' + VAULT + '&file=' + encodeURIComponent('Model Tracker/Kits/' + stem);
const $ = id => document.getElementById(id);
function render(){
  let h = (location.hash||'').slice(1); let mode = '';
  if (h.startsWith('dt-')) { mode='dt'; h=h.slice(3); } else if (h.startsWith('ob-')) { mode='ob'; h=h.slice(3); }
  h = h.toUpperCase();
  const kit = KITS[h];
  if (!kit) { browse(); return; }
  $('name').textContent = kit[0];
  $('meta').textContent = kit[1];
  $('dt').href = dtLink(h); $('ob').href = obLink(kit[1]);
  $('actions').hidden = false; $('browse').hidden = true;
  if (mode) {
    const target = mode==='dt' ? dtLink(h) : obLink(kit[1]);
    $('hint').textContent = 'Opening in ' + (mode==='dt' ? 'DEVONthink' : 'Obsidian') + '… If nothing happens, use the button above (your browser may ask once to allow it).';
    try { location.href = target; } catch(e) {}
  } else {
    $('hint').textContent = 'Choose where to open this kit. Both apps must be installed on this Mac.';
  }
}
function browse(){
  $('name').textContent = 'Kit launcher'; $('meta').textContent = Object.keys(KITS).length + ' kits';
  $('actions').hidden = true; $('browse').hidden = false;
  $('hint').textContent = 'Pick a kit to open it in DEVONthink or Obsidian. Links from Notion jump straight to a kit.';
  fill('');
}
function fill(q){
  q = q.toLowerCase();
  const ul = $('list'); ul.innerHTML = '';
  Object.entries(KITS).filter(([u,k]) => !q || k[1].toLowerCase().includes(q)).sort((a,b)=>a[1][1].localeCompare(b[1][1]))
    .forEach(([u,k]) => { const li=document.createElement('li'); const a=document.createElement('a'); a.href='#'+u; a.textContent=k[1]; li.appendChild(a); ul.appendChild(li); });
}
$('q').addEventListener('input', e => fill(e.target.value));
window.addEventListener('hashchange', render);
render();
</script>

</body></html>
